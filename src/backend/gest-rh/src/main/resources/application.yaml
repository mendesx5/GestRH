spring:
  application:
    name: gest-rh

  datasource:
    url: jdbc:postgresql://localhost:5432/gest_rh
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:troque-este-valor-por-uma-chave-secreta-bem-grande-e-aleatoria}
  expiration-ms: 86400000